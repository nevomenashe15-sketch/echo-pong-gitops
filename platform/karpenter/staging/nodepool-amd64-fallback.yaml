---
# NodePool — staging, amd64 fallback. Same rationale as production: without a
# pool that can create amd64 nodes, the app's soft arm64 preference has no
# fallback to fall back to.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: echo-pong-staging-amd64-fallback
spec:
  weight: 10
  template:
    metadata:
      labels:
        echo-pong.io/nodegroup: app
        echo-pong.io/arch-pool: amd64
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: echo-pong-staging
      expireAfter: 168h
      terminationGracePeriod: 6h
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["c7i", "m7i", "c6i", "m6i"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["medium", "large"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["eu-west-1a", "eu-west-1b", "eu-west-1c"]
  limits:
    cpu: "8"
    memory: 32Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m
    budgets:
      - nodes: "20%"
