---
# =============================================================================
# ClusterSecretStore: AWS Secrets Manager
# =============================================================================
# One cluster-scoped store, referenced by every echo-pong ExternalSecret in
# every namespace. Cluster-scoped rather than per-namespace because the AWS
# identity is a property of the ESO controller's own ServiceAccount (via its
# EKS Pod Identity association), not of the consuming namespace — a namespaced
# SecretStore would duplicate that wiring without adding isolation.
#
# NOTE ON BLAST RADIUS: any namespace whose ExternalSecret references this
# store can read any secret the ESO controller's IAM role is allowed to read.
# The isolation therefore lives in the IAM policy (created by the sibling
# Terraform repo), which is scoped to the echo-pong/* secret path only —
# not in this object. If a second, unrelated workload is ever onboarded, give
# it its own store + role rather than widening this one.
#
# No credentials appear here. `auth` is omitted entirely, which makes the AWS
# SDK use the ambient credentials the Pod Identity agent injects into the ESO
# controller pod.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
  labels:
    app.kubernetes.io/part-of: echo-pong
    app.kubernetes.io/managed-by: argocd
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
