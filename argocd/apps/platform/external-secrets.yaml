---
# =============================================================================
# Platform add-on: External Secrets Operator
# =============================================================================
# Reads the app's bearer token from AWS Secrets Manager and materialises it as
# a native Kubernetes Secret, which the echo-pong pod mounts read-only. This is
# the ONLY component in the cluster with an AWS identity for that secret.
#
# Ownership boundary: the sibling Terraform repo creates the Secrets Manager
# secret metadata, the IAM read policy/role, and the EKS Pod Identity
# association for the ServiceAccount below. It never writes the secret VALUE.
#
# Sync wave -10: the ExternalSecret CRD must exist before any Application that
# ships an ExternalSecret is synced.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.10.5
    helm:
      releaseName: external-secrets
      values: |
        installCRDs: true
        replicaCount: 2
        leaderElect: true
        serviceAccount:
          create: true
          name: external-secrets
          # EKS Pod Identity association (created by Terraform) supplies the
          # AWS credentials. IRSA fallback, if ever needed:
          #   annotations:
          #     eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/echo-pong-prod-external-secrets
          annotations: {}
        webhook:
          replicaCount: 2
        certController:
          replicaCount: 1
        nodeSelector:
          kubernetes.io/arch: arm64
          echo-pong.io/nodegroup: system
        tolerations:
          - key: CriticalAddonsOnly
            operator: Exists
            effect: NoSchedule
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 300m
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ESO's CRDs are large enough to blow past the 256KB
      # last-applied-configuration annotation limit under client-side apply.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
