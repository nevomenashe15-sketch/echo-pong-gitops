---
# =============================================================================
# AppProject: platform (cluster add-ons)
# =============================================================================
# Deliberately broader than the echo-pong project, because these add-ons
# genuinely need cluster scope: they install their own CRDs, ClusterRoles and
# webhooks, and Karpenter's NodePool/EC2NodeClass are cluster-scoped by design.
#
# It is still bounded in the ways that matter:
#   * sourceRepos is this repo PLUS the specific upstream chart repositories the
#     add-ons come from — nothing else can be deployed through this project;
#   * destinations are the add-ons' own namespaces, never the app namespaces;
#   * cluster-scoped kinds are enumerated rather than wildcarded.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  description: Cluster platform add-ons managed by GitOps after Argo CD bootstrap

  sourceRepos:
    - https://github.com/nevomenashe15-sketch/echo-pong-gitops.git
    - https://aws.github.io/eks-charts
    - https://charts.external-secrets.io
    - oci://public.ecr.aws/karpenter

  destinations:
    - namespace: kube-system
      server: https://kubernetes.default.svc
    - namespace: external-secrets
      server: https://kubernetes.default.svc
    - namespace: karpenter
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: ""
      kind: Namespace
    - group: storage.k8s.io
      kind: StorageClass
    - group: karpenter.sh
      kind: NodePool
    - group: karpenter.k8s.aws
      kind: EC2NodeClass
    - group: external-secrets.io
      kind: ClusterSecretStore
    - group: elbv2.k8s.aws
      kind: IngressClassParams
    - group: networking.k8s.io
      kind: IngressClass
    - group: scheduling.k8s.io
      kind: PriorityClass

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  roles:
    - name: readonly
      description: Read-only access for reviewers and on-call
      policies:
        - p, proj:platform:readonly, applications, get, platform/*, allow
      groups: []
