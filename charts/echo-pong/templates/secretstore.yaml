{{- if and .Values.externalSecret.enabled .Values.externalSecret.secretStore.create }}
# Optional namespaced SecretStore. OFF by default — the shared, cluster-scoped
# ClusterSecretStore in platform/external-secrets/ is the normal path, because
# a namespaced store needs its own ServiceAccount plus a matching EKS Pod
# Identity association, duplicating platform wiring for no isolation benefit
# in a single-tenant namespace.
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: SecretStore
metadata:
  name: {{ include "echo-pong.fullname" . }}
  labels:
    {{- include "echo-pong.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecret.secretStore.region }}
      {{- with .Values.externalSecret.secretStore.serviceAccountRef }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ . }}
      {{- end }}
{{- end }}
