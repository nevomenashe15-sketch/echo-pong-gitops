{{- if .Values.externalSecret.enabled }}
# -----------------------------------------------------------------------------
# External Secrets Operator — AWS Secrets Manager -> Kubernetes Secret
# -----------------------------------------------------------------------------
# Flow:
#   Terraform (sibling repo) creates the Secrets Manager secret METADATA and
#   the IAM read permission, plus the EKS Pod Identity association for ESO's
#   OWN ServiceAccount. It never writes the value.
#     -> ESO reads the value with that identity
#     -> ESO writes a native Kubernetes Secret (name below)
#     -> this chart's Deployment mounts that Secret read-only as a FILE
#     -> the Go app reads the file once at startup via SECRET_FILE_PATH
#
# The echo-pong pod itself has no AWS identity and needs none.
# The value never appears in this chart, in values files, in Git, or in any
# env var. Only the remote secret's NAME is configured.
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "echo-pong.fullname" . }}
  labels:
    {{- include "echo-pong.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    {{- if .Values.externalSecret.secretStore.create }}
    name: {{ include "echo-pong.fullname" . }}
    kind: SecretStore
    {{- else }}
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
    {{- end }}
  target:
    name: {{ include "echo-pong.secretName" . }}
    creationPolicy: {{ .Values.externalSecret.creationPolicy }}
    # Retain: if this ExternalSecret is pruned, the live Secret survives, so a
    # mis-sync cannot instantly break every running pod's mounted token.
    deletionPolicy: {{ .Values.externalSecret.deletionPolicy }}
  data:
    # No `template:` block is used on purpose. A template would put a Go
    # template expression referencing the secret value into the manifest; the
    # plain data mapping keeps the chart entirely value-free and renders the
    # Secret with exactly one key.
    - secretKey: {{ .Values.secret.key }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteRef.key | quote }}
        {{- with .Values.externalSecret.remoteRef.property }}
        property: {{ . | quote }}
        {{- end }}
        {{- with .Values.externalSecret.remoteRef.version }}
        version: {{ . | quote }}
        {{- end }}
{{- end }}
